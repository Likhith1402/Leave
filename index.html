<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For You 🤍</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont;
      background:
        linear-gradient(135deg, rgba(176,196,222,0.35), rgba(255,228,225,0.35)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2f2f2f;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      max-width: 720px;
      padding: 30px 26px;
      border-radius: 20px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
      color: #444;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      margin: 14px 0;
    }

    .signature {
      margin-top: 18px;
      font-weight: 600;
      opacity: 0.8;
    }

    button {
      margin-top: 22px;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      color: #123;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(161,196,253,0.45);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(161,196,253,0.6);
    }

    .badge {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(173,216,230,0.45);
      color: #1e4a5f;
      border: 1px solid rgba(173,216,230,0.7);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 id="title"></h1>
    <div id="content"></div>
  </div>

  <script>
    // ✅ Your requested changes (exact)
    const PERSON_NAME = "My Dear Bestie (Buntey❤️)";
    const YOUR_NAME = "Sai likhith";
    const MESSAGE = "I’m really sorry for what happened. I understand I hurt you😢, and I don’t want to repeat that. Please give me a chance to make things right🙏🤌.";
    const KEY = "apologyAccepted_v1";

    document.getElementById("title").textContent = `Hey ${PERSON_NAME} 🌼`;

    function render() {
      const accepted = localStorage.getItem(KEY) === "true";
      const content = document.getElementById("content");

      if (accepted) {
        content.innerHTML = `
          <p><span class="badge">🤍 Apology accepted</span></p>
          <p>
            Thank you for understanding.
            I truly appreciate our friendship and the chance
            to move forward with clarity and respect.
          </p>
        `;
      } else {
        content.innerHTML = `
          <p>${MESSAGE}</p>
          <p class="signature">— ${YOUR_NAME}</p>
          <button id="acceptBtn">Accept apology</button>
        `;

        document.getElementById("acceptBtn").onclick = () => {
          localStorage.setItem(KEY, "true");
          render();
        };
      }
    }

    render();
  </script>
</body>
</html>
