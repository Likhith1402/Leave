<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apology</title>
  <style>
    body { font-family: system-ui, Arial; background:#0b1220; color:#e8eefc; margin:0; padding:24px; }
    .card { max-width:720px; margin:40px auto; background:#111b33; border:1px solid #223056;
      border-radius:16px; padding:24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .badge { display:inline-block; padding:8px 12px; border-radius:999px; font-weight:700; }
    .ok { background: rgba(45,212,191,.18); color:#7ff3e6; border:1px solid rgba(45,212,191,.35); }
    button { cursor:pointer; border:0; padding:12px 16px; border-radius:12px; font-weight:700;
      background:#2dd4bf; color:#06201c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title"></h1>
    <div id="content"></div>
  </div>

  <script>
    const PERSON_NAME = "Friend";
    const YOUR_NAME = "Sai";
    const MESSAGE = "I’m really sorry for what happened. I understand I hurt you, and I don’t want to repeat that. Thank you for giving me a chance to make things right.";
    const KEY = "apologyAccepted_v1";

    document.getElementById("title").textContent = `To ${PERSON_NAME}`;

    function render() {
      const accepted = localStorage.getItem(KEY) === "true";
      const content = document.getElementById("content");
      if (accepted) {
        content.innerHTML = `
          <p><span class="badge ok">✅ Apology accepted</span></p>
          <p>Thank you. I’ll prove it with my actions, not just words.</p>
        `;
      } else {
        content.innerHTML = `
          <p>${MESSAGE}</p>
          <p>— ${YOUR_NAME}</p>
          <button id="btn">Accept apology</button>
        `;
        document.getElementById("btn").onclick = () => {
          localStorage.setItem(KEY, "true");
          render();
        };
      }
    }

    render();
  </script>
</body>
</html>
